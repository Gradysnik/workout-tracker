name: CI
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: flutter test
      # Проверяет релизную Android-сборку — тем же путём, что и Release APK.
      # APK в демо-режиме и подписан отладочным ключом: вход через Google в нём
      # не работает, для телефона берите APK из Releases.
      - run: flutter build apk --release --dart-define=DEMO=true
      - uses: actions/upload-artifact@v4
        with:
          name: demo-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
